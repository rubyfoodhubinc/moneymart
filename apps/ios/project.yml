name: MoneyMart
options:
  bundleIdPrefix: com.moneymart
  deploymentTarget:
    iOS: "18.0"
  createIntermediateGroups: true
  developmentLanguage: en
settings:
  base:
    SWIFT_VERSION: "6.0"
    SWIFT_STRICT_CONCURRENCY: complete
    MARKETING_VERSION: "2.0.0"
    CURRENT_PROJECT_VERSION: "1"
    DEVELOPMENT_TEAM: ""
    ENABLE_USER_SCRIPT_SANDBOXING: YES
    LOCALIZATION_PREFERS_STRING_CATALOGS: YES
    SWIFT_EMIT_LOC_STRINGS: YES
targets:
  MoneyMart:
    type: application
    platform: iOS
    sources:
      - path: MoneyMart
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: com.moneymart.app
        PRODUCT_NAME: MoneyMart
        INFOPLIST_FILE: MoneyMart/Resources/Info.plist
        ASSETCATALOG_COMPILER_APPICON_NAME: AppIcon
        ASSETCATALOG_COMPILER_GLOBAL_ACCENT_COLOR_NAME: AccentColor
        TARGETED_DEVICE_FAMILY: "1,2"
        CODE_SIGN_STYLE: Automatic
        ENABLE_PREVIEWS: YES
        SUPPORTS_MACCATALYST: NO
      configs:
        Debug:
          SWIFT_ACTIVE_COMPILATION_CONDITIONS: DEBUG
  MoneyMartTests:
    type: bundle.unit-test
    platform: iOS
    sources:
      - path: MoneyMartTests
    dependencies:
      - target: MoneyMart
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: com.moneymart.app.tests
        GENERATE_INFOPLIST_FILE: YES
        BUNDLE_LOADER: $(TEST_HOST)
        TEST_HOST: $(BUILT_PRODUCTS_DIR)/MoneyMart.app/$(BUNDLE_EXECUTABLE_FOLDER_PATH)/MoneyMart
  MoneyMartUITests:
    type: bundle.ui-testing
    platform: iOS
    sources:
      - path: MoneyMartUITests
    dependencies:
      - target: MoneyMart
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: com.moneymart.app.uitests
        GENERATE_INFOPLIST_FILE: YES
        TEST_TARGET_NAME: MoneyMart
schemes:
  MoneyMart:
    build:
      targets:
        MoneyMart: all
        MoneyMartTests: [test]
        MoneyMartUITests: [test]
    run:
      config: Debug
    test:
      config: Debug
      targets:
        - MoneyMartTests
        - MoneyMartUITests
    archive:
      config: Release
